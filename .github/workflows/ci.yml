name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest)
        run: pytest

  ai-service:
    name: AI service - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker - build images & smoke test
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q "DocVerify AI"
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8000/api/health
          # Register an applicant through the frontend proxy
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","full_name":"CI Test","password":"Ci-Password-123"}'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
